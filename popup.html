<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Find and replace - Replacinator</title>
    <link rel="stylesheet" href="popup.css">
    <script src="popup.js" defer></script>
  </head>
  <body>
    <main>
      <p class="brand">Replacinator</p>
      <h1>Find and replace</h1>
      <p id="match-help">
        Replaces the entire value of input fields on the current page.
        Matching is case-sensitive.
      </p>
      <form id="replace-form">
        <div class="field">
          <label for="search">Find</label>
          <input id="search" name="search" type="text" autocomplete="off"
            autocorrect="off" autocapitalize="none" spellcheck="false"
            aria-describedby="match-help search-help">
          <p id="search-help">Leave empty to find empty input fields.</p>
        </div>

        <div class="field">
          <label for="replacement">Replace with</label>
          <input id="replacement" name="replacement" type="text" autocomplete="off"
            autocorrect="off" autocapitalize="none" spellcheck="false"
            aria-describedby="replacement-help">
          <p id="replacement-help">Leave empty to clear matching values.</p>
        </div>

        <button type="submit">Replace</button>
        <div id="feedback">
          <svg class="alert-icon" data-variant="positive" viewBox="0 0 24 24"
            fill="none" stroke="currentColor" stroke-width="2"
            aria-hidden="true" focusable="false" hidden>
            <circle cx="12" cy="12" r="9"></circle>
            <path d="m8 12 3 3 5-6"></path>
          </svg>
          <svg class="alert-icon" data-variant="warning" viewBox="0 0 24 24"
            fill="none" stroke="currentColor" stroke-width="2"
            aria-hidden="true" focusable="false" hidden>
            <path d="M12 3 2 21h20Z M12 9v5 M12 17v2"></path>
          </svg>
          <svg class="alert-icon" data-variant="negative" viewBox="0 0 24 24"
            fill="none" stroke="currentColor" stroke-width="2"
            aria-hidden="true" focusable="false" hidden>
            <circle cx="12" cy="12" r="9"></circle>
            <path d="m9 9 6 6 m0-6-6 6"></path>
          </svg>
          <p id="status" role="status" aria-atomic="true"></p>
          <button id="dismiss-message" class="alert-dismiss" type="button"
            aria-label="Dismiss message" hidden>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2" aria-hidden="true" focusable="false">
              <path d="m6 6 12 12 m0-12L6 18"></path>
            </svg>
          </button>
        </div>
      </form>
    </main>
  </body>
</html>
